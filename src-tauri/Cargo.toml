[package]
name = "roomy"
version = "1.0.0"
description = "See where your Mac's storage and memory went"
edition = "2021"

[lib]
name = "roomy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jwalk = "0.8"
blake3 = { version = "1", features = ["mmap"] }
rayon = "1"
sysinfo = "0.37"
trash = "5"
libc = "0.2"
dirs = "6"

[profile.release]
opt-level = 3
lto = "thin"

[features]
custom-protocol = ["tauri/custom-protocol"]
